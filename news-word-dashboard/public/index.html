<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYT vs WSJ Word Frequency Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0f14;
      --surface: #151921;
      --border: #252d3a;
      --text: #e4e8f1;
      --text-dim: #8a92a6;
      --nyt-blue: #1a6aff;
      --nyt-blue-20: rgba(26, 106, 255, 0.2);
      --wsj-orange: #e87f24;
      --wsj-orange-20: rgba(232, 127, 36, 0.2);
      --accent: #6c5ce7;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    h1, h2, h3 { font-family: 'Playfair Display', serif; }

    .header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--nyt-blue), var(--wsj-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .meta {
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    .header .meta span { margin: 0 0.75rem; }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
    }
    .stat-card .number {
      font-size: 2rem;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
    }
    .stat-card .label {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }
    .stat-card.nyt .number { color: var(--nyt-blue); }
    .stat-card.wsj .number { color: var(--wsj-orange); }
    .stat-card.shared .number { color: var(--accent); }

    /* Section */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .section h2 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* Chart grid */
    .chart-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 900px) {
      .chart-row { grid-template-columns: 1fr; }
    }
    .chart-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }
    .chart-box h3 {
      font-size: 1.15rem;
      margin-bottom: 1rem;
    }
    .chart-box canvas { width: 100% !important; }

    /* Distinctive words */
    .pills-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 700px) {
      .pills-row { grid-template-columns: 1fr; }
    }
    .pill-group h3 {
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .pill {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .pill.nyt {
      background: var(--nyt-blue-20);
      color: var(--nyt-blue);
      border: 1px solid var(--nyt-blue);
    }
    .pill.wsj {
      background: var(--wsj-orange-20);
      color: var(--wsj-orange);
      border: 1px solid var(--wsj-orange);
    }

    /* Findings */
    .findings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }
    .finding-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      font-size: 0.95rem;
      line-height: 1.5;
      border-left: 3px solid var(--accent);
    }

    /* Doughnut row */
    .doughnut-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 700px) {
      .doughnut-row { grid-template-columns: 1fr; }
    }
    .doughnut-box { text-align: center; }
    .doughnut-box canvas {
      max-width: 350px;
      margin: 0 auto;
    }

    /* Loading / error */
    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--text-dim);
      font-size: 1.1rem;
    }
    .error {
      text-align: center;
      padding: 2rem;
      color: #e74c3c;
    }

    .legend-inline {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .legend-inline span::before {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle;
    }
    .legend-inline .nyt::before { background: var(--nyt-blue); }
    .legend-inline .wsj::before { background: var(--wsj-orange); }
  </style>
</head>
<body>

<div class="header">
  <h1>NYT vs WSJ Coverage</h1>
  <div class="meta">
    <span id="lastUpdated">Loading...</span>
    <span id="dateRange"></span>
  </div>
</div>

<div class="container" id="app">
  <div class="loading" id="loadingMsg">Fetching analysis data...</div>
</div>

<script>
const NYT_COLOR = '#1a6aff';
const WSJ_COLOR = '#e87f24';
const NYT_BG = 'rgba(26, 106, 255, 0.7)';
const WSJ_BG = 'rgba(232, 127, 36, 0.7)';

Chart.defaults.color = '#8a92a6';
Chart.defaults.borderColor = '#252d3a';
Chart.defaults.font.family = "'DM Sans', sans-serif";

async function loadData() {
  const res = await fetch('/api/data');
  if (!res.ok) throw new Error('No data available yet');
  return res.json();
}

function formatTimestamp(iso) {
  return new Date(iso).toLocaleString('en-US', {
    month: 'short', day: 'numeric', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function renderDashboard(data) {
  document.getElementById('lastUpdated').textContent = 'Last updated: ' + formatTimestamp(data.generated_at);
  document.getElementById('dateRange').textContent =
    `Date range: ${data.date_range.start} \u2013 ${data.date_range.end}`;

  const app = document.getElementById('app');
  app.innerHTML = '';

  // 1. Stats bar
  const statsHtml = `
    <div class="stats-bar">
      <div class="stat-card nyt">
        <div class="number">${data.stats.nyt_unique}</div>
        <div class="label">NYT Unique Words</div>
      </div>
      <div class="stat-card wsj">
        <div class="number">${data.stats.wsj_unique}</div>
        <div class="label">WSJ Unique Words</div>
      </div>
      <div class="stat-card shared">
        <div class="number">${data.stats.shared}</div>
        <div class="label">Shared Words</div>
      </div>
      <div class="stat-card">
        <div class="number">${data.stats.total}</div>
        <div class="label">Total Distinct Words</div>
      </div>
    </div>`;
  app.insertAdjacentHTML('beforeend', statsHtml);

  // 2. Top 25 horizontal bars
  app.insertAdjacentHTML('beforeend', `
    <div class="chart-row">
      <div class="chart-box">
        <h3 style="color:${NYT_COLOR}">NYT Top 25 Words</h3>
        <canvas id="nytTop25"></canvas>
      </div>
      <div class="chart-box">
        <h3 style="color:${WSJ_COLOR}">WSJ Top 25 Words</h3>
        <canvas id="wsjTop25"></canvas>
      </div>
    </div>`);

  createHorizontalBar('nytTop25', data.nyt_top25, NYT_COLOR, NYT_BG);
  createHorizontalBar('wsjTop25', data.wsj_top25, WSJ_COLOR, WSJ_BG);

  // 3. Side-by-side comparison
  app.insertAdjacentHTML('beforeend', `
    <div class="section">
      <h2>Shared Word Comparison</h2>
      <div class="legend-inline">
        <span class="nyt">NYT</span>
        <span class="wsj">WSJ</span>
      </div>
      <canvas id="sharedChart" height="400"></canvas>
    </div>`);
  createSharedChart('sharedChart', data.shared_top20);

  // 4. Radar + Doughnuts row
  app.insertAdjacentHTML('beforeend', `
    <div class="chart-row">
      <div class="chart-box">
        <h3>Topic Category Radar</h3>
        <canvas id="radarChart"></canvas>
      </div>
      <div class="chart-box">
        <h3>Coverage Focus Areas</h3>
        <canvas id="radarBar"></canvas>
      </div>
    </div>`);
  createRadarChart('radarChart', data.radar);
  createRadarBarChart('radarBar', data.radar);

  // 5. Distinctive words
  app.insertAdjacentHTML('beforeend', `
    <div class="section">
      <h2>Distinctive Words</h2>
      <div class="pills-row">
        <div class="pill-group">
          <h3 style="color:${NYT_COLOR}">NYT Only</h3>
          <div class="pills" id="nytPills"></div>
        </div>
        <div class="pill-group">
          <h3 style="color:${WSJ_COLOR}">WSJ Only</h3>
          <div class="pills" id="wsjPills"></div>
        </div>
      </div>
    </div>`);

  const nytPills = document.getElementById('nytPills');
  data.nyt_only.forEach(w => {
    nytPills.insertAdjacentHTML('beforeend', `<span class="pill nyt">${w}</span>`);
  });
  const wsjPills = document.getElementById('wsjPills');
  data.wsj_only.forEach(w => {
    wsjPills.insertAdjacentHTML('beforeend', `<span class="pill wsj">${w}</span>`);
  });

  // 6. Doughnut charts
  app.insertAdjacentHTML('beforeend', `
    <div class="chart-row">
      <div class="chart-box doughnut-box">
        <h3 style="color:${NYT_COLOR}">NYT Top 10 Proportions</h3>
        <canvas id="nytDoughnut"></canvas>
      </div>
      <div class="chart-box doughnut-box">
        <h3 style="color:${WSJ_COLOR}">WSJ Top 10 Proportions</h3>
        <canvas id="wsjDoughnut"></canvas>
      </div>
    </div>`);
  createDoughnut('nytDoughnut', data.nyt_top10, NYT_COLOR);
  createDoughnut('wsjDoughnut', data.wsj_top10, WSJ_COLOR);

  // 7. Key findings
  if (data.findings && data.findings.length > 0) {
    let findingsHtml = '<div class="section"><h2>Key Findings</h2><div class="findings-grid">';
    data.findings.forEach(f => {
      findingsHtml += `<div class="finding-card">${f}</div>`;
    });
    findingsHtml += '</div></div>';
    app.insertAdjacentHTML('beforeend', findingsHtml);
  }
}

function createHorizontalBar(canvasId, items, borderColor, bgColor) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: items.map(i => i[0]),
      datasets: [{
        data: items.map(i => i[1]),
        backgroundColor: bgColor,
        borderColor: borderColor,
        borderWidth: 1,
        borderRadius: 4,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#1a2030' } },
        y: { grid: { display: false } }
      }
    }
  });
}

function createSharedChart(canvasId, items) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: items.map(i => i.word),
      datasets: [
        {
          label: 'NYT',
          data: items.map(i => i.nyt),
          backgroundColor: NYT_BG,
          borderColor: NYT_COLOR,
          borderWidth: 1,
          borderRadius: 4,
        },
        {
          label: 'WSJ',
          data: items.map(i => i.wsj),
          backgroundColor: WSJ_BG,
          borderColor: WSJ_COLOR,
          borderWidth: 1,
          borderRadius: 4,
        }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { grid: { color: '#1a2030' }, beginAtZero: true }
      }
    }
  });
}

function createRadarChart(canvasId, radar) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  new Chart(ctx, {
    type: 'radar',
    data: {
      labels: radar.categories,
      datasets: [
        {
          label: 'NYT',
          data: radar.nyt,
          borderColor: NYT_COLOR,
          backgroundColor: 'rgba(26, 106, 255, 0.15)',
          borderWidth: 2,
          pointBackgroundColor: NYT_COLOR,
        },
        {
          label: 'WSJ',
          data: radar.wsj,
          borderColor: WSJ_COLOR,
          backgroundColor: 'rgba(232, 127, 36, 0.15)',
          borderWidth: 2,
          pointBackgroundColor: WSJ_COLOR,
        }
      ]
    },
    options: {
      responsive: true,
      scales: {
        r: {
          beginAtZero: true,
          max: 100,
          grid: { color: '#252d3a' },
          angleLines: { color: '#252d3a' },
          pointLabels: { font: { size: 12 } },
          ticks: { display: false }
        }
      },
      plugins: {
        legend: {
          labels: { usePointStyle: true, padding: 20 }
        }
      }
    }
  });
}

function createRadarBarChart(canvasId, radar) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: radar.categories,
      datasets: [
        {
          label: 'NYT',
          data: radar.nyt,
          backgroundColor: NYT_BG,
          borderColor: NYT_COLOR,
          borderWidth: 1,
          borderRadius: 4,
        },
        {
          label: 'WSJ',
          data: radar.wsj,
          backgroundColor: WSJ_BG,
          borderColor: WSJ_COLOR,
          borderWidth: 1,
          borderRadius: 4,
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { usePointStyle: true, padding: 20 } }
      },
      scales: {
        x: { grid: { display: false } },
        y: { grid: { color: '#1a2030' }, beginAtZero: true, max: 100 }
      }
    }
  });
}

function generatePalette(baseColor, count) {
  const colors = [];
  for (let i = 0; i < count; i++) {
    const opacity = 0.9 - (i * 0.06);
    if (baseColor === NYT_COLOR) {
      colors.push(`rgba(26, 106, 255, ${Math.max(opacity, 0.3)})`);
    } else {
      colors.push(`rgba(232, 127, 36, ${Math.max(opacity, 0.3)})`);
    }
  }
  return colors;
}

function createDoughnut(canvasId, items, baseColor) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  const palette = generatePalette(baseColor, items.length);
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: items.map(i => i[0]),
      datasets: [{
        data: items.map(i => i[1]),
        backgroundColor: palette,
        borderColor: '#151921',
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      cutout: '55%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: { padding: 12, usePointStyle: true, font: { size: 11 } }
        }
      }
    }
  });
}

// Load and render
async function init() {
  try {
    const data = await loadData();
    renderDashboard(data);
  } catch (err) {
    document.getElementById('loadingMsg').innerHTML =
      '<div class="error">No analysis data available yet. The pipeline may still be running. Will retry shortly...</div>';
    // Retry in 30 seconds
    setTimeout(init, 30000);
  }
}

init();

// Auto-refresh every 30 minutes
setInterval(() => {
  loadData().then(renderDashboard).catch(() => {});
}, 30 * 60 * 1000);
</script>
</body>
</html>
